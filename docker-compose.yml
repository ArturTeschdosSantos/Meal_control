services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meal_control
      POSTGRES_USER: meal
      POSTGRES_PASSWORD: meal_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal -d meal_control"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:
